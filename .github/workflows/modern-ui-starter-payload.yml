name: Modern UI Starter Payload Manifest

on:
  pull_request:
    paths:
      - "content/asset_indexes/game_maker/*.json"
      - "imports/manifests/asset_bundles/BND-009-modern-ui-starter-payload.json"
      - "tools/ci/check_modern_ui_starter_payload_manifest.py"
      - ".github/workflows/modern-ui-starter-payload.yml"
  push:
    branches: [main]
    paths:
      - "content/asset_indexes/game_maker/*.json"
      - "imports/manifests/asset_bundles/BND-009-modern-ui-starter-payload.json"
      - "tools/ci/check_modern_ui_starter_payload_manifest.py"
      - ".github/workflows/modern-ui-starter-payload.yml"
  workflow_dispatch:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate modern UI starter payload manifest
        run: python tools/ci/check_modern_ui_starter_payload_manifest.py
